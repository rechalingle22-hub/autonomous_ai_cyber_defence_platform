name: Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Code Quality, Linting & Static Typing
  # ============================================================================
  quality:
    name: Code Quality & Type Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Linting & Static Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pyright Type Checker
        run: |
          pyright

  # ============================================================================
  # 2. Automated Test Suite (Phases 1-12)
  # ============================================================================
  test:
    name: Automated Pytest Suite
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js 24 (Frontend Build Verification)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Compile Frontend Bundle
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full Test Suite
        env:
          SIMULATION_MODE: "true"
          REQUIRE_HUMAN_APPROVAL_FOR_CONTAINMENT: "true"
          ENVIRONMENT: "testing"
          DEBUG: "false"
        run: |
          pytest -v

  # ============================================================================
  # 3. Multi-Stage Docker Container Build Verification
  # ============================================================================
  docker-verify:
    name: Docker Multi-Stage Build Check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Build Multi-Stage Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cyberdefense:ci-verify

