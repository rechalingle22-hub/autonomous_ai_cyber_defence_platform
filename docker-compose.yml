services:
  # ============================================================================
  # 1. FastAPI ASGI Backend & Embedded SOC Frontend Console
  # ============================================================================
  soc-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberdefense-soc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PROJECT_NAME=Autonomous AI Cyber Defense Platform
      - ENVIRONMENT=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:-PRODUCTION_SUPER_SECRET_KEY_CYBER_DEFENSE_0987654321}
      - DATABASE_URL=postgresql+asyncpg://cyberdefense:cyberdefense_secure_pass@postgres:5432/cyberdefense
      - REDIS_URL=redis://:redis_secure_pass@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=cyberdefense_neo4j_pass
      - SIMULATION_MODE=true
      - REQUIRE_HUMAN_APPROVAL_FOR_CONTAINMENT=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - cyber-net

  # ============================================================================
  # 2. Relational Database: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cyberdefense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberdefense
      POSTGRES_USER: cyberdefense
      POSTGRES_PASSWORD: cyberdefense_secure_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberdefense -d cyberdefense"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyber-net

  # ============================================================================
  # 3. In-Memory Cache & Message Broker: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: cyberdefense-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis_secure_pass", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secure_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyber-net

  # ============================================================================
  # 4. Graph Database: Neo4j 5 Community
  # ============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: cyberdefense-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/cyberdefense_neo4j_pass
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - cyber-net

# ==============================================================================
# Persistent Named Storage Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  cyber-net:
    driver: bridge

